name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A1E9CB: ${{ secrets.A1E9CB }}
          B78FC5: ${{ secrets.B78FC5 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A1E9CB', '')
          bm = os.environ.get('B78FC5', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 8e7633b60fb9cf3e85165cc803bf6d367541 -->', gm)
          if bm:
              s2 = s2.replace('<!-- b3d241330a8a39c81b8a632a84cc9297 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
